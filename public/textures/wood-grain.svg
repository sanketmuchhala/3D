<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#D2B48C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DEB887;stop-opacity:1" />
    </linearGradient>
    
    <pattern id="woodGrain" x="0" y="0" width="64" height="512" patternUnits="userSpaceOnUse">
      <rect width="64" height="512" fill="url(#woodBase)" />
      
      <!-- Wood grain lines -->
      <path d="M0,50 Q32,45 64,50" stroke="#654321" stroke-width="1" fill="none" opacity="0.6"/>
      <path d="M0,120 Q32,115 64,120" stroke="#654321" stroke-width="1" fill="none" opacity="0.4"/>
      <path d="M0,200 Q32,195 64,200" stroke="#8B4513" stroke-width="1.5" fill="none" opacity="0.7"/>
      <path d="M0,280 Q32,275 64,280" stroke="#654321" stroke-width="1" fill="none" opacity="0.5"/>
      <path d="M0,350 Q32,345 64,350" stroke="#654321" stroke-width="1" fill="none" opacity="0.6"/>
      <path d="M0,420 Q32,415 64,420" stroke="#8B4513" stroke-width="1.5" fill="none" opacity="0.8"/>
      
      <!-- Knots -->
      <ellipse cx="20" cy="180" rx="8" ry="6" fill="#654321" opacity="0.8"/>
      <ellipse cx="45" cy="320" rx="6" ry="4" fill="#654321" opacity="0.6"/>
    </pattern>
  </defs>
  
  <rect width="512" height="512" fill="url(#woodGrain)" />
</svg>