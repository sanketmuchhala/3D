<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="paintBase" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#e9ecef;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#dee2e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ced4da;stop-opacity:1" />
    </radialGradient>
    
    <!-- Subtle noise pattern for wall texture -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence baseFrequency="0.9" numOctaves="4" result="noise" seed="5"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0.1 0.05 0.02 0.08 0.03"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    
    <!-- Subtle brush stroke pattern -->
    <pattern id="brushStroke" x="0" y="0" width="128" height="128" patternUnits="userSpaceOnUse">
      <rect width="128" height="128" fill="url(#paintBase)" />
      
      <!-- Vertical brush marks -->
      <path d="M20,0 L20,128" stroke="#d6d9db" stroke-width="0.5" opacity="0.3"/>
      <path d="M45,0 L45,128" stroke="#d6d9db" stroke-width="0.3" opacity="0.2"/>
      <path d="M70,0 L70,128" stroke="#d6d9db" stroke-width="0.4" opacity="0.25"/>
      <path d="M95,0 L95,128" stroke="#d6d9db" stroke-width="0.3" opacity="0.2"/>
      <path d="M108,0 L108,128" stroke="#d6d9db" stroke-width="0.5" opacity="0.3"/>
      
      <!-- Horizontal variation -->
      <path d="M0,30 L128,32" stroke="#dde1e3" stroke-width="0.2" opacity="0.15"/>
      <path d="M0,60 L128,58" stroke="#dde1e3" stroke-width="0.3" opacity="0.1"/>
      <path d="M0,90 L128,92" stroke="#dde1e3" stroke-width="0.2" opacity="0.12"/>
    </pattern>
  </defs>
  
  <rect width="512" height="512" fill="url(#brushStroke)" filter="url(#noise)" />
</svg>