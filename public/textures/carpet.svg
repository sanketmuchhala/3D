<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="carpetBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#4a5568;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#1a202c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    
    <!-- Carpet fiber texture -->
    <filter id="carpetTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence baseFrequency="0.5" numOctaves="3" result="fibers" seed="2"/>
      <feColorMatrix in="fibers" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0.2 0.1 0.05 0.15 0.08"/>
      </feComponentTransfer>
      <feComposite operator="multiply" in2="SourceGraphic"/>
    </filter>
    
    <!-- Carpet weave pattern -->
    <pattern id="carpetWeave" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="url(#carpetBase)" />
      
      <!-- Woven texture -->
      <rect x="0" y="0" width="16" height="16" fill="#1a202c" opacity="0.3"/>
      <rect x="16" y="16" width="16" height="16" fill="#1a202c" opacity="0.3"/>
      <rect x="0" y="16" width="16" height="16" fill="#4a5568" opacity="0.2"/>
      <rect x="16" y="0" width="16" height="16" fill="#4a5568" opacity="0.2"/>
      
      <!-- Fiber details -->
      <circle cx="8" cy="8" r="1" fill="#4a5568" opacity="0.4"/>
      <circle cx="24" cy="8" r="1" fill="#2d3748" opacity="0.4"/>
      <circle cx="8" cy="24" r="1" fill="#2d3748" opacity="0.4"/>
      <circle cx="24" cy="24" r="1" fill="#4a5568" opacity="0.4"/>
    </pattern>
  </defs>
  
  <rect width="512" height="512" fill="url(#carpetWeave)" filter="url(#carpetTexture)" />
</svg>