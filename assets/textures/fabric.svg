<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fabricBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#3730a3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>
    
    <!-- Fabric weave pattern -->
    <pattern id="fabricWeave" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="url(#fabricBase)" />
      
      <!-- Horizontal threads -->
      <rect x="0" y="0" width="16" height="1" fill="#8b5cf6" opacity="0.6"/>
      <rect x="0" y="2" width="16" height="1" fill="#7c3aed" opacity="0.4"/>
      <rect x="0" y="4" width="16" height="1" fill="#8b5cf6" opacity="0.5"/>
      <rect x="0" y="6" width="16" height="1" fill="#7c3aed" opacity="0.3"/>
      <rect x="0" y="8" width="16" height="1" fill="#8b5cf6" opacity="0.6"/>
      <rect x="0" y="10" width="16" height="1" fill="#7c3aed" opacity="0.4"/>
      <rect x="0" y="12" width="16" height="1" fill="#8b5cf6" opacity="0.5"/>
      <rect x="0" y="14" width="16" height="1" fill="#7c3aed" opacity="0.3"/>
      
      <!-- Vertical threads -->
      <rect x="0" y="0" width="1" height="16" fill="#5b21b6" opacity="0.5"/>
      <rect x="2" y="0" width="1" height="16" fill="#6d28d9" opacity="0.3"/>
      <rect x="4" y="0" width="1" height="16" fill="#5b21b6" opacity="0.4"/>
      <rect x="6" y="0" width="1" height="16" fill="#6d28d9" opacity="0.3"/>
      <rect x="8" y="0" width="1" height="16" fill="#5b21b6" opacity="0.5"/>
      <rect x="10" y="0" width="1" height="16" fill="#6d28d9" opacity="0.3"/>
      <rect x="12" y="0" width="1" height="16" fill="#5b21b6" opacity="0.4"/>
      <rect x="14" y="0" width="1" height="16" fill="#6d28d9" opacity="0.3"/>
    </pattern>
    
    <!-- Subtle fabric texture -->
    <filter id="fabricFibers" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence baseFrequency="0.3" numOctaves="2" result="texture" seed="3"/>
      <feColorMatrix in="texture" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0.1 0.05 0.02 0.08"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" fill="url(#fabricWeave)" filter="url(#fabricFibers)" />
</svg>